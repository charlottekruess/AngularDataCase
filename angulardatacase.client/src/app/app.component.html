<mat-toolbar color="primary" class="topbar">
  <span>Calculate analytics</span>
</mat-toolbar>
<main class="page" [formGroup]="form">
  <mat-card class="panel">
    <app-selectors [sections]="sections()" />
    <div class="actions">
      <button mat-raised-button color="primary" [disabled]="form.invalid || loading()" (click)="onCalculate()">
        Calculate
      </button>
    </div>
  </mat-card>
  @if (error()) { <p class="error">{{ error() }}</p> }
  <mat-card class="panel">
    <app-results-table [rows]="rows()" [columns]="columns()" [loading]="loading()" />
  </mat-card>
</main>
